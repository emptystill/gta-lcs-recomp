# Hand-made adjustments merged by tools/make_config.py into game/lcs/game.toml (Liberty City Stories, SLUS_214.23).
#
# Each entry is the LCS twin of one in game/vcs/overrides.toml (same reason; read there). Addresses found by
# tools/xmatch.py from VCS's function (code compared with link-time addresses masked) and, where it names them, the
# same from ps2_analyzer's SDK identification - both agree on every one (2026-11-14). The SDK is the same build in
# both games: the libraries keep their layout, only shifted.

# SDK functions whose runtime handler is only a TODO that throws: recompile the game's own copy (the tty / Deci2 ones
# end in the Deci2Call syscall, which the runtime implements).
drop_stubs = [
  "sceDmaPause@0x0035FCD0",     # VCS 0x004489F8
  "sceTtyHandler@0x0037E5C0",   # VCS 0x00468628
  "sceTtyWrite@0x0037E758",     # VCS 0x004687C0
  "sceTtyRead@0x0037E8D0",      # VCS 0x00468938
  "sceTtyInit@0x0037E9A0",      # VCS 0x00468A08
  "sceDeci2Open@0x00384A30",    # VCS 0x0046EA98
  "sceDeci2ReqSend@0x00384A80", # VCS 0x0046EAE8
  "sceDeci2Poll@0x00384AB0",    # VCS 0x0046EB18 (xmatch: 2 candidates; layout and the analyzer pick this one)
  "sceDeci2ExRecv@0x00384AE0",  # VCS 0x0046EB48 (likewise)
  "sceDeci2ExSend@0x00384B18",  # VCS 0x0046EB80 (likewise)
]

stubs = [
  # _lf_bind spins until the IOP ROM's LOADFILE RPC server answers; the runtime loads modules itself: success.
  "ret0@0x00382CA8",            # VCS 0x0046CD10
  # libfileio directory API -> runtime (served from the mapped disc)
  "sceDopen@0x00382750",        # VCS 0x0046C7B8
  "sceDread@0x00382980",        # VCS 0x0046C9E8
  "sceDclose@0x00382818",       # VCS 0x0046C880
  # libcdvd calls that RPC the IOP ROM's cdvdfsv server, which doesn't exist here
  "sceCdSearchFile@0x00365758", # VCS 0x0044E480
  "sceCdSearchFile@0x00365458", # VCS 0x0044E180: sceCdLayerSearchFile(fp, name, layer), layer ignored
  "sceCdGetDiskType@0x00366280", # VCS 0x0044EFA8: sceCdGetDiskType2
  "sceCdDiskReady@0x00365E20",  # VCS 0x0044EB48: sceCdDiskReady_old
]

# Instruction patches (address -> replacement word), applied by the recompiler.
#
# CTimer::Update (FUN_002B4CF8) floors the time step at 0.5 (1/100 s) inline: `lui $at, 0x3F00` at 0x2B4EC0 is both
# the compare's operand and the value stored. With frame-rate independent timing above 100 fps that floor made the
# game run fast (each frame counted as 1/100 s). 0x3E55 = 0.2080 (~1/240 s), the VCS port's floor (its kMaxFps 240,
# game/vcs_framerate.cpp). Steps >= 0.5 (30 to 100 fps, and original timing) run exactly as before.
[[patches]]
address = "0x002B4EC0"
value = "0x3C013E55"

# The ped's animation movement turned into its velocity (+0x4D8 / +0x4DC; VCS FUN_001F1D38 at 0x1F2158, the same code):
# `if (ms_fTimeStep < 0.5) v *= 0.5; else v *= 1 / ms_fTimeStep;` - the `< 0.5` branch is dead on the PS2 and above
# 100 fps (independent timing) made peds walk / run at a fraction of their speed (Toni walked 1.0 m in a second at
# 144 fps, 3.3 at 30). `lui $at, 0x3F00` at 0x1D5978 feeds only the compare and that branch's multiply ($f3): 0.001
# sends every real step down the 1 / step path, as in VCS. Steps >= 0.5 run exactly as before.
[[patches]]
address = "0x001D5978"
value = "0x3C013A83"

# The cutscene objects' animation movement (CCutsceneObject::ProcessControl's twin, VCS FUN_0031AE38 at 0x31B19C):
# `if (step < 0.5) v *= 2 (add.s); else v *= 1 / step` on +0x70.. - the same dead branch, so above 100 fps cutscene
# objects moved too little. `lui $at, 0x3F00` at 0x2B75A8 is only the compare's ($f0 reloaded right after): 0.001.
[[patches]]
address = "0x002B75A8"
value = "0x3C013A83"

# The PC camera's mouse-aim switch (CCamera::m_bUseMouse3rdPerson, 0x3D6C98; VC PC's code is still in LCS: CCam
# Using3rdPersonMouseCam 0x286F88, the HUD's crosshair in CHud::Draw 0x23F438, Find3rdPersonCamTargetVector 0x28D1B0).
# The PS2 build turns it off every frame in the menu manager's process (FUN_0034AF20 at 0x34B154: `if (flag) flag = 0`,
# the store in the bnel's delay slot at 0x34B160). Without that store nothing changes while the flag is 0 (the PS2's
# value: it is set only from the control method at a new game / load, FUN_00342B20, and LCS's method is 1); the
# mouse-aim setting (src/game/lcs_overrides.cpp) sets it. docs/LCS.md "Mouse aim".
[[patches]]
address = "0x0034B160"
value = "0x00000000"
